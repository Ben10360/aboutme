<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Vazirmatn',sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.9)),
url("https://4kwallpapers.com/images/walls/thumbs_3t/10750.jpg");

background-size:cover;
background-position:center;

overflow:hidden;

}

.card{

width:95%;
max-width:450px;

padding:35px;

background:rgba(255,255,255,.05);

backdrop-filter:blur(20px);

border-radius:35px;

border:1px solid rgba(255,255,255,.08);

box-shadow:0 0 50px rgba(0,255,136,.15);

text-align:center;

color:white;

}

.avatar{

width:180px;
height:180px;

border-radius:50%;

object-fit:cover;

border:4px solid rgba(0,255,136,.4);

box-shadow:0 0 35px rgba(0,255,136,.4);

margin-bottom:20px;

}

.name{

font-size:38px;
font-weight:700;

}

.role{

margin-top:10px;

color:#00ff88;

font-size:16px;

}

.info{

margin-top:30px;

display:flex;
flex-direction:column;
gap:12px;

}

.box{

padding:16px;

background:rgba(255,255,255,.05);

border-radius:18px;

border:1px solid rgba(255,255,255,.05);

font-size:17px;

}

.buttons{

display:flex;

gap:12px;

margin-top:25px;

}

.buttons a{

flex:1;

padding:15px;

border-radius:16px;

background:#00ff88;

color:black;

font-weight:700;

text-decoration:none;

transition:.3s;

}

.buttons a:hover{

transform:translateY(-4px);

}

@media(max-width:500px){

.avatar{

width:150px;
height:150px;

}

.name{

font-size:30px;

}

}

</style>

</head>
