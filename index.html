<style>

body{

radial-gradient(circle at top left,#00ff8840,transparent 30%),

overflow:hidden;

}

/* BACKGROUND SHAPES */

.shape1{

position:absolute;

width:400px;
height:400px;

background:#00ff88;

filter:blur(180px);

opacity:0.15;

top:-150px;
left:-120px;

border-radius:50%;

}

.shape2{

position:absolute;

width:350px;
height:350px;

background:#00ff88;

filter:blur(180px);

opacity:0.1;

bottom:-150px;
right:-100px;

border-radius:50%;

}

/* CARD */

.card{

width:420px;

background:rgba(255,255,255,0.04);

border:1px solid rgba(255,255,255,0.08);

backdrop-filter:blur(25px);

border-radius:40px;

padding:35px;

position:relative;

box-shadow:0 0 50px rgba(0,255,136,0.08);

}

/* PROFILE IMAGE */

.avatar-box{

display:flex;
justify-content:center;

margin-top:-110px;

}

.avatar{

width:190px;
height:190px;

border-radius:35px;

object-fit:cover;

border:4px solid rgba(0,255,136,0.3);

box-shadow:0 0 40px rgba(0,255,136,0.2);

}

/* NAME */

.name{

text-align:center;

font-size:38px;
font-weight:700;

margin-top:25px;

color:white;

}

.role{

width:max-content;

margin:18px auto;

padding:12px 22px;

border-radius:16px;

background:rgba(255,255,255,0.05);

border:1px solid rgba(255,255,255,0.08);

color:#00ff88;

font-size:15px;

}

/* SOCIALS */

.socials{

display:flex;
justify-content:center;
gap:15px;

margin-top:25px;
margin-bottom:35px;

}

.social{

width:60px;
height:60px;

border-radius:18px;

background:rgba(255,255,255,0.05);

border:1px solid rgba(255,255,255,0.08);

display:flex;
justify-content:center;
align-items:center;

font-size:28px;

cursor:pointer;

transition:0.3s;

}

.social:hover{

transform:translateY(-5px);

background:#00ff88;

color:black;

}

/* INFO BOX */

.info-box{

background:rgba(255,255,255,0.03);

border:1px solid rgba(255,255,255,0.05);

border-radius:28px;

padding:20px;

display:flex;
flex-direction:column;
gap:15px;

}

/* ITEM */

.item{

background:rgba(0,0,0,0.25);

border-radius:18px;

padding:18px 20px;

display:flex;
justify-content:space-between;
align-items:center;

border:1px solid rgba(255,255,255,0.05);

}

.label{

color:#999;

font-size:14px;

}

.value{

color:white;

font-size:18px;

font-weight:500;

}

/* MOBILE */

@media(max-width:500px){

.card{

width:95%;

padding:25px;

}

.avatar{

width:160px;
height:160px;

}

.name{

font-size:30px;

}

}

</style>
